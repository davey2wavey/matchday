<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matchday · NBA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: table left, fixtures right; stacks on phone. Plain working tool. */
:root{
  --bg:#f6f5f1;--panel:#ffffff;--fg:#17191c;--muted:#6b7075;--line:#e1dfd8;--line-2:#eeece6;
  --accent:#1f5f3a;--accent-soft:#e2efe6;--amber:#b7791f;--amber-soft:#f6ecd6;--red:#b4342a;--red-soft:#f5e1de;
  --live:#c8201a;--hover:#f1efe9;
  --body:"DM Sans",system-ui,-apple-system,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141517;--panel:#1c1e21;--fg:#ececec;--muted:#9a9ea3;--line:#2b2e33;--line-2:#24272b;
  --accent:#5fb783;--accent-soft:#1d3327;--amber:#e0a83a;--amber-soft:#3a2f16;--red:#e46a60;--red-soft:#3b1f1c;
  --live:#ff5a4e;--hover:#24272b;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141517;--panel:#1c1e21;--fg:#ececec;--muted:#9a9ea3;--line:#2b2e33;--line-2:#24272b;
  --accent:#5fb783;--accent-soft:#1d3327;--amber:#e0a83a;--amber-soft:#3a2f16;--red:#e46a60;--red-soft:#3b1f1c;
  --live:#ff5a4e;--hover:#24272b;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:14px;line-height:1.4}
body{padding-block:0 32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
a{color:inherit}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lbl{font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:14px 10px;border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5}
header h1{font-size:17px;font-weight:600;margin:0;letter-spacing:-.01em}
header h1 span{color:var(--muted);font-weight:400}
.tabs{display:flex;gap:2px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)}
.tabs button{padding:5px 11px;border-radius:4px;color:var(--muted);font-weight:500}
.tabs button[aria-selected="true"]{background:var(--fg);color:var(--bg)}
.tabs button:hover:not([aria-selected="true"]){background:var(--hover)}
.spacer{flex:1}
.stamp{font-family:var(--mono);font-size:11px;color:var(--muted)}

main{display:grid;grid-template-columns:minmax(300px,380px) minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
@media (max-width:860px){main{grid-template-columns:1fr}}
section{background:var(--panel);border:1px solid var(--line);border-radius:8px;min-width:0}
.sec-h{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.sec-h h2{margin:0;font-size:13px;font-weight:600}

/* standings */
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-family:var(--mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:500;text-align:right;padding:8px 6px;border-bottom:1px solid var(--line)}
th:nth-child(2),td:nth-child(2){text-align:left}
td{padding:6px 6px;border-bottom:1px solid var(--line-2);text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
td.team{font-family:var(--body);font-weight:500;width:100%;white-space:normal}
td.team button{display:flex;align-items:center;gap:8px;text-align:left;padding:0}
td.team button:hover{text-decoration:underline}
td.pos{color:var(--muted);padding-left:10px;position:relative}
tr.z-top td.pos::before,tr.z-mid td.pos::before,tr.z-bot td.pos::before{content:"";position:absolute;left:3px;top:6px;bottom:6px;width:3px;border-radius:2px}
tr.z-top td.pos::before{background:var(--accent)}tr.z-mid td.pos::before{background:var(--amber)}tr.z-bot td.pos::before{background:var(--red)}
td.pts{font-weight:600}
.logo{width:18px;height:18px;object-fit:contain;flex:none}
.group-h{padding:8px 12px;background:var(--bg);font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);border-bottom:1px solid var(--line)}
.legend{display:flex;gap:14px;padding:8px 12px;font-size:11px;color:var(--muted)}
.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.tblwrap{overflow-x:auto}

/* fixtures */
.nav{display:flex;align-items:center;gap:6px}
.nav button{padding:4px 9px;border:1px solid var(--line);border-radius:5px;font-size:12px}
.nav button:hover{background:var(--hover)}
.range{font-family:var(--mono);font-size:12px;padding:0 6px;min-width:150px;text-align:center}
.vtoggle{margin-left:auto}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:0;min-height:260px}
.day{border-right:1px solid var(--line-2);padding:8px 6px;min-width:0}
.day:last-child{border-right:0}
.day.today{background:color-mix(in srgb,var(--accent) 6%,transparent)}
.day-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;padding:0 2px}
.day-h b{font-size:12px;font-weight:600}
.day-h .n{font-family:var(--mono);font-size:11px;color:var(--muted)}
.day.today .day-h b{color:var(--accent)}
.card{display:block;width:100%;text-align:left;border:1px solid var(--line);border-radius:6px;padding:6px 7px;margin-bottom:6px;background:var(--panel);min-width:0}
.card:hover{background:var(--hover);border-color:var(--muted)}
.card .t{font-family:var(--mono);font-size:10.5px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.card .t .live{color:var(--live);font-weight:600}
.card .t .ft{color:var(--muted)}
.card .row{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:12.5px;min-width:0}
.card .row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card .row .sc{font-family:var(--mono);font-weight:600;min-width:1.2em;text-align:right}
.card .row.w .nm{font-weight:600}
.card .logo{width:14px;height:14px}
.card .tv{font-family:var(--mono);font-size:10px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{font-size:11px;color:var(--muted);padding:4px 2px}
/* day list */
.list{padding:0}
.list .dh{display:flex;align-items:baseline;gap:10px;padding:10px 12px;background:var(--bg);border-bottom:1px solid var(--line);border-top:1px solid var(--line);font-weight:600;font-size:13px}
.list .dh:first-child{border-top:0}
.list .dh .n{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:400}
.list .dh.today{color:var(--accent)}
.lrow{display:grid;grid-template-columns:62px minmax(0,1fr) auto minmax(0,1fr) 110px;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 12px;border-bottom:1px solid var(--line-2)}
.lrow:hover{background:var(--hover)}
.lrow .tm{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.lrow .tm.live{color:var(--live);font-weight:600}
.lrow .side{display:flex;align-items:center;gap:7px;min-width:0;font-size:13px}
.lrow .side.r{justify-content:flex-end;text-align:right}
.lrow .side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .side.w span{font-weight:600}
.lrow .sc{font-family:var(--mono);font-weight:600;font-size:13px;min-width:44px;text-align:center}
.lrow .tv{font-family:var(--mono);font-size:10.5px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media (max-width:860px){
  .week{display:none}
  .lrow{grid-template-columns:52px minmax(0,1fr) auto minmax(0,1fr)}
  .lrow .tv{display:none}
  .vtoggle{display:none}
}
.list .empty{padding:20px 12px;font-size:13px}

/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-left,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-right,0px));z-index:20;overflow-y:auto}
.ov[hidden]{display:none}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);max-height:calc(100vh - 48px);overflow-y:auto}
.m-h{display:flex;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.m-h h3{margin:0;font-size:14px;font-weight:600;flex:1;min-width:0}
.m-h .x{padding:4px 8px;border-radius:5px;font-size:16px;line-height:1}
.m-h .x:hover{background:var(--hover)}
.m-b{padding:14px}
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:14px}
.score .tm{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.score .tm .logo{width:40px;height:40px}
.score .tm button{font-weight:600;font-size:13px}
.score .tm button:hover{text-decoration:underline}
.score .tm .rec{font-family:var(--mono);font-size:11px;color:var(--muted)}
.score .mid{font-family:var(--mono);font-size:26px;font-weight:600;text-align:center}
.score .mid small{display:block;font-size:11px;font-weight:400;color:var(--muted);margin-top:2px}
.score .mid small.live{color:var(--live);font-weight:600}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13px;margin-bottom:14px}
.kv .k{font-family:var(--mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.odds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.odds div{border:1px solid var(--line);border-radius:6px;padding:8px;text-align:center}
.odds div b{display:block;font-family:var(--mono);font-size:15px;margin-top:2px}
.odds div span{font-size:11px;color:var(--muted)}
.ou{grid-column:1/-1;display:flex;justify-content:center;gap:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
h4{margin:14px 0 8px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-family:var(--mono);font-weight:500}
.lineups{display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:12.5px}
.lineups ol{margin:0;padding:0;list-style:none}
.lineups li{display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line-2)}
.lineups li .no{font-family:var(--mono);color:var(--muted);min-width:2em;text-align:right}
.lineups li .pos{font-family:var(--mono);color:var(--muted);font-size:11px;min-width:1.5em}
.lineups .form{font-family:var(--mono);font-size:11px;color:var(--muted);margin-bottom:6px}
.frm{display:inline-flex;gap:3px}
.frm i{display:inline-block;width:16px;height:16px;border-radius:3px;font:600 10px/16px var(--mono);text-align:center;font-style:normal;color:#fff}
.frm .W{background:#2e8b57}.frm .D{background:#8a8f94}.frm .L{background:#c0392b}
.sched{list-style:none;margin:0;padding:0;font-size:12.5px}
.sched li{display:grid;grid-template-columns:70px 1fr auto;gap:10px;padding:6px 0;border-bottom:1px solid var(--line-2);align-items:center}
.sched li .d{font-family:var(--mono);font-size:11px;color:var(--muted)}
.sched li .r{font-family:var(--mono);font-size:11.5px;text-align:right}
.sched li .r.W{color:#2e8b57}.sched li .r.L{color:#c0392b}
.sched li button{text-align:left;padding:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sched li button:hover{text-decoration:underline}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(70px,1fr));gap:8px;margin-bottom:6px}
.stats div{border:1px solid var(--line);border-radius:6px;padding:7px;text-align:center}
.stats div b{display:block;font-family:var(--mono);font-size:16px}
.stats div span{font-size:10.5px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:.05em}
.roster{columns:2;column-gap:16px;font-size:12.5px}
.roster li{break-inside:avoid;display:flex;gap:8px;padding:3px 0;border-bottom:1px solid var(--line-2)}
.roster li .no{font-family:var(--mono);color:var(--muted);min-width:2em;text-align:right}
.roster li .pos{font-family:var(--mono);color:var(--muted);font-size:11px;min-width:1.5em}
.note{font-size:12px;color:var(--muted)}
.err{padding:14px;color:var(--red);font-size:13px}
.loading{padding:14px;color:var(--muted);font-family:var(--mono);font-size:12px}
@media (prefers-reduced-motion:no-preference){.card,.lrow{transition:background .1s}}
</style>
</head>
<body>
<header>
  <h1>Matchday <span>/ NBA</span></h1>
  <div class="tabs" role="tablist" id="leagues"></div>
  <div class="spacer"></div>
  <div class="stamp" id="stamp"></div>
</header>

<main>
  <section id="standings">
    <div class="sec-h"><h2>Standings</h2><span class="lbl" id="st-sub"></span></div>
    <div id="st-body" class="loading">Loading standings…</div>
  </section>

  <section id="fixtures">
    <div class="sec-h">
      <h2>Games</h2>
      <div class="nav">
        <button id="prev" aria-label="Previous week">‹</button>
        <button id="today">This week</button>
        <button id="next" aria-label="Next week">›</button>
        <span class="range" id="range"></span>
      </div>
      <div class="tabs vtoggle" role="tablist" id="views">
        <button role="tab" data-v="week" aria-selected="true">Week</button>
        <button role="tab" data-v="day" aria-selected="false">Day</button>
      </div>
    </div>
    <div id="fx-body" class="loading">Loading games…</div>
  </section>
</main>

<div class="ov" id="ov" hidden>
  <div class="modal" role="dialog" aria-modal="true">
    <div class="m-h"><h3 id="m-title"></h3><button class="x" id="m-x" aria-label="Close">×</button></div>
    <div class="m-b" id="m-body"></div>
  </div>
</div>

<script>
const API='https://site.api.espn.com/apis';
const SPORT='basketball',LG='nba';
const TZ='America/Los_Angeles';
const LEAGUES=[{id:'nba',name:'NBA'}];
const S={lg:LEAGUES[0],view:'week',weekStart:null,events:[],teamsById:{},standingsRows:[]};
try{const v=localStorage.getItem('md-nba-view');if(v)S.view=v;}catch(e){}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cache={};
async function getJSON(url){
  if(cache[url]&&Date.now()-cache[url].t<120000)return cache[url].d;
  const r=await fetch(url);if(!r.ok)throw new Error('ESPN '+r.status);
  const d=await r.json();cache[url]={t:Date.now(),d};return d;
}
function laParts(d){
  const p=new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit',weekday:'short',hour:'numeric',minute:'2-digit',hour12:true}).formatToParts(d);
  const o={};p.forEach(x=>o[x.type]=x.value);return o;
}
const ymd=d=>{const p=laParts(d);return `${p.year}-${p.month}-${p.day}`;};
const ymdc=d=>ymd(d).replace(/-/g,'');
function fmtTime(d){const p=laParts(d);return `${p.hour}:${p.minute} ${p.dayPeriod.toLowerCase()}`;}
function fmtDate(d,o){return new Intl.DateTimeFormat('en-US',Object.assign({timeZone:TZ},o)).format(d);}
function addDays(d,n){const x=new Date(d);x.setUTCDate(x.getUTCDate()+n);return x;}
function mondayOf(d){
  const p=laParts(d);const dow=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'].indexOf(p.weekday);
  const back=(dow+6)%7;const base=new Date(Date.UTC(+p.year,+p.month-1,+p.day,12));return addDays(base,-back);
}
const todayKey=()=>ymd(new Date());
function stat(entry,names){for(const n of names){const s=entry.stats.find(x=>x.name===n||x.abbreviation===n||x.label===n);if(s)return s.displayValue??s.value;}return '';}

/* ---------- header ---------- */
function renderLeagueTabs(){
  const el=$('#leagues');if(LEAGUES.length<2){el.hidden=true;return;}
  el.innerHTML=LEAGUES.map(l=>`<button role="tab" data-lg="${l.id}" aria-selected="${l.id===S.lg.id}">${l.name}</button>`).join('');
}
$('#views').querySelectorAll('button').forEach(b=>b.onclick=()=>{S.view=b.dataset.v;try{localStorage.setItem('md-nba-view',S.view)}catch(e){}syncViewTabs();renderFixtures();});
function syncViewTabs(){$('#views').querySelectorAll('button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===S.view));}
$('#prev').onclick=()=>{S.weekStart=addDays(S.weekStart,-7);loadFixtures();};
$('#next').onclick=()=>{S.weekStart=addDays(S.weekStart,7);loadFixtures();};
$('#today').onclick=()=>{S.weekStart=mondayOf(new Date());loadFixtures();};

/* ---------- standings ---------- */
async function loadStandings(){
  const el=$('#st-body');el.className='loading';el.textContent='Loading standings…';$('#st-sub').textContent='';
  try{
    const d=await getJSON(`${API}/v2/sports/${SPORT}/${LG}/standings`);
    const groups=(d.children&&d.children.length?d.children:[d]).filter(g=>g.standings&&g.standings.entries);
    S.standingsRows=[];
    let html='';
    groups.forEach(g=>{
      const rows=g.standings.entries.slice().sort((a,b)=>(+stat(a,['playoffSeed'])||99)-(+stat(b,['playoffSeed'])||99));
      html+=`<div class="group-h">${esc(g.name||g.abbreviation||'')}</div>`;
      html+=`<div class="tblwrap"><table><thead><tr><th>#</th><th>Team</th><th>W</th><th>L</th><th>Pct</th><th>GB</th><th>L10</th><th>Strk</th></tr></thead><tbody>`;
      rows.forEach((e,i)=>{
        const t=e.team;const pos=+stat(e,['playoffSeed'])||i+1;
        S.teamsById[t.id]=t;S.standingsRows.push(e);
        let z='';if(pos<=6)z='z-top';else if(pos<=10)z='z-mid';
        const logo=(t.logos&&t.logos[0]&&t.logos[0].href)||'';
        const pct=stat(e,['winPercent']);const l10=stat(e,['Last Ten Games']);const strk=stat(e,['streak']);
        html+=`<tr class="${z}"><td class="pos">${pos}</td><td class="team"><button data-team="${t.id}">${logo?`<img class="logo" src="${logo}" alt="">`:''}<span>${esc(t.shortDisplayName||t.displayName)}</span></button></td><td>${stat(e,['wins'])}</td><td>${stat(e,['losses'])}</td><td>${esc(String(pct).replace(/^0\./,'.'))}</td><td>${stat(e,['gamesBehind'])}</td><td>${esc(l10)}</td><td>${esc(strk)}</td></tr>`;
      });
      html+='</tbody></table></div>';
    });
    html+=`<div class="legend"><span><i style="background:var(--accent)"></i>Playoffs</span><span><i style="background:var(--amber)"></i>Play-in</span></div>`;
    el.className='';el.innerHTML=html;
    $('#st-sub').textContent=(d.season&&d.season.displayName)||'';
    el.querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>openTeam(b.dataset.team));
  }catch(e){el.className='err';el.textContent='Standings failed to load. '+e.message;}
}

/* ---------- fixtures ---------- */
async function loadFixtures(){
  const el=$('#fx-body');el.className='loading';el.textContent='Loading games…';
  const days=[...Array(7)].map((_,i)=>addDays(S.weekStart,i));
  $('#range').textContent=`${fmtDate(days[0],{month:'short',day:'numeric'})} – ${fmtDate(days[6],{month:'short',day:'numeric'})}`;
  try{
    // ESPN dates are keyed on US Eastern; LA late games stay on same ET date. Fetch one extra day each side.
    const fetchDays=[addDays(days[0],-1),...days,addDays(days[6],1)];
    const res=await Promise.all(fetchDays.map(d=>getJSON(`${API}/site/v2/sports/${SPORT}/${LG}/scoreboard?dates=${ymdc(d)}`).catch(()=>({events:[]}))));
    const seen=new Set();
    S.events=res.flatMap(d=>d.events||[]).filter(e=>{if(seen.has(e.id))return false;seen.add(e.id);return true;})
      .map(normalize).filter(e=>{const k=ymd(e.date);return k>=ymd(days[0])&&k<=ymd(days[6]);})
      .sort((a,b)=>a.date-b.date);
    S.events.forEach(e=>{S.teamsById[e.home.team.id]=S.teamsById[e.home.team.id]||e.home.team;S.teamsById[e.away.team.id]=S.teamsById[e.away.team.id]||e.away.team;});
    renderFixtures();
    $('#stamp').textContent='Updated '+fmtTime(new Date())+' PT';
  }catch(e){el.className='err';el.textContent='Games failed to load. '+e.message;}
}
function normalize(e){
  const c=e.competitions[0];const home=c.competitors.find(x=>x.homeAway==='home')||c.competitors[0];const away=c.competitors.find(x=>x.homeAway==='away')||c.competitors[1];
  const st=c.status||e.status;const state=st.type.state;
  const bc=(c.broadcasts||e.broadcasts||[]).flatMap(b=>b.names||(b.media&&b.media.shortName?[b.media.shortName]:[]));
  return {id:e.id,date:new Date(e.date),home,away,state,completed:st.type.completed,clock:st.displayClock,period:st.period,detail:st.type.shortDetail,
    venue:c.venue,tv:[...new Set(bc)],odds:(c.odds&&c.odds[0])||null,raw:e};
}
function periodLabel(e){
  if(e.period>4)return 'OT'+(e.period>5?e.period-4:'');
  if(e.detail&&/half/i.test(e.detail))return 'Half';
  return 'Q'+e.period;
}
function scoreLabel(e){
  if(e.state==='pre')return fmtTime(e.date);
  if(e.state==='in')return `${periodLabel(e)} ${e.clock||''}`;
  return e.period>4?'Final/OT':'Final';
}
function renderFixtures(){
  const el=$('#fx-body');el.className='';
  const days=[...Array(7)].map((_,i)=>addDays(S.weekStart,i));
  const tk=todayKey();
  const byDay={};days.forEach(d=>byDay[ymd(d)]=[]);S.events.forEach(e=>{const k=ymd(e.date);if(byDay[k])byDay[k].push(e);});
  const logo=t=>t.logo?`<img class="logo" src="${t.logo}" alt="">`:'';
  const useWeek=S.view==='week'&&window.innerWidth>860;
  if(useWeek){
    el.innerHTML=`<div class="week">${days.map(d=>{const k=ymd(d);const list=byDay[k];
      return `<div class="day ${k===tk?'today':''}"><div class="day-h"><b>${fmtDate(d,{weekday:'short'})}</b><span class="n">${fmtDate(d,{month:'numeric',day:'numeric'})}</span></div>${
        list.length?list.map(e=>{
          const hw=e.completed&&+e.home.score>+e.away.score,aw=e.completed&&+e.away.score>+e.home.score;
          return `<button class="card" data-ev="${e.id}"><div class="t"><span class="${e.state==='in'?'live':e.state==='post'?'ft':''}">${scoreLabel(e)}</span></div>
          <div class="row ${aw?'w':''}">${logo(e.away.team)}<span class="nm">${esc(e.away.team.shortDisplayName)}</span><span class="sc">${e.state==='pre'?'':esc(e.away.score)}</span></div>
          <div class="row ${hw?'w':''}">${logo(e.home.team)}<span class="nm">${esc(e.home.team.shortDisplayName)}</span><span class="sc">${e.state==='pre'?'':esc(e.home.score)}</span></div>
          ${e.tv.length?`<div class="tv">${esc(e.tv.join(', '))}</div>`:''}</button>`;}).join(''):`<div class="empty">—</div>`}</div>`;}).join('')}</div>`;
  }else{
    const parts=days.map(d=>{const k=ymd(d);const list=byDay[k];if(!list.length)return '';
      return `<div class="dh ${k===tk?'today':''}"><span>${fmtDate(d,{weekday:'long'})}</span><span class="n">${fmtDate(d,{month:'short',day:'numeric'})}</span></div>`+list.map(e=>{
        const hw=e.completed&&+e.home.score>+e.away.score,aw=e.completed&&+e.away.score>+e.home.score;
        return `<button class="lrow" data-ev="${e.id}"><span class="tm ${e.state==='in'?'live':''}">${scoreLabel(e)}</span>
        <span class="side r ${aw?'w':''}"><span>${esc(e.away.team.shortDisplayName)}</span>${logo(e.away.team)}</span>
        <span class="sc">${e.state==='pre'?'@':esc(e.away.score)+' – '+esc(e.home.score)}</span>
        <span class="side ${hw?'w':''}">${logo(e.home.team)}<span>${esc(e.home.team.shortDisplayName)}</span></span>
        <span class="tv">${esc(e.tv.join(', '))}</span></button>`;}).join('');}).join('');
    el.innerHTML=`<div class="list">${parts||`<div class="empty">No games this week.</div>`}</div>`;
  }
  el.querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>openGame(b.dataset.ev));
}
let rT;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(renderFixtures,150);});

/* ---------- modal ---------- */
function openModal(title,html){$('#m-title').textContent=title;$('#m-body').innerHTML=html;$('#ov').hidden=false;document.body.style.overflow='hidden';}
function closeModal(){$('#ov').hidden=true;document.body.style.overflow='';}
$('#m-x').onclick=closeModal;$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal();};
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});

/* ---------- game detail ---------- */
async function openGame(id){
  const e=S.events.find(x=>x.id===id);if(!e)return;
  const rec=c=>(c.records&&c.records[0]&&c.records[0].summary)||'';
  const tm=c=>`<div class="tm"><img class="logo" src="${c.team.logo||''}" alt=""><button data-team="${c.team.id}">${esc(c.team.displayName)}</button><span class="rec">${esc(rec(c))}</span></div>`;
  const mid=e.state==='pre'?`<div class="mid">${fmtTime(e.date)}<small>${fmtDate(e.date,{weekday:'short',month:'short',day:'numeric'})}</small></div>`
    :`<div class="mid">${esc(e.away.score)} – ${esc(e.home.score)}<small class="${e.state==='in'?'live':''}">${esc(scoreLabel(e))}</small></div>`;
  const v=e.venue?`${e.venue.fullName||''}${e.venue.address?`, ${e.venue.address.city||''}${e.venue.address.state?', '+e.venue.address.state:''}`:''}`:'—';
  const html=`<div class="score">${tm(e.away)}${mid}${tm(e.home)}</div>
  <div class="kv"><span class="k">Tip-off</span><span>${fmtDate(e.date,{weekday:'long',month:'long',day:'numeric'})} · ${fmtTime(e.date)} PT</span>
  <span class="k">Arena</span><span>${esc(v)}</span><span class="k">TV</span><span>${e.tv.length?esc(e.tv.join(', ')):'—'}</span></div>
  <div id="odds"></div><div id="box"><div class="loading">Loading…</div></div>`;
  openModal(`${e.away.team.shortDisplayName} @ ${e.home.team.shortDisplayName}`,html);
  $('#m-body').querySelectorAll('[data-team]').forEach(b=>b.onclick=()=>openTeam(b.dataset.team));
  try{
    const s=await getJSON(`${API}/site/v2/sports/${SPORT}/${LG}/summary?event=${id}`);
    const ob=$('#odds'),box=$('#box');if(!box)return;
    const pc=(s.pickcenter||[])[0];
    if(pc&&ob){ob.innerHTML=`<h4>Line · ${esc((pc.provider&&pc.provider.name)||'')}</h4><div class="odds"><div><span>Spread</span><b>${esc(pc.details||'—')}</b></div><div><span>O/U</span><b>${esc(pc.overUnder??'—')}</b></div><div><span>ML</span><b>${esc((pc.awayTeamOdds&&pc.awayTeamOdds.moneyLine)??'—')} / ${esc((pc.homeTeamOdds&&pc.homeTeamOdds.moneyLine)??'—')}</b></div></div>`;}
    const players=(s.boxscore&&s.boxscore.players)||[];
    const withStats=players.filter(p=>p.statistics&&p.statistics[0]&&p.statistics[0].athletes&&p.statistics[0].athletes.length);
    if(withStats.length){
      box.innerHTML=`<h4>Box score</h4>`+withStats.map(p=>{const st=p.statistics[0];const keys=st.keys||[];const want=['minutes','points','rebounds','assists','fieldGoalsMade-fieldGoalsAttempted','threePointFieldGoalsMade-threePointFieldGoalsAttempted'];
        const idx=want.map(k=>keys.indexOf(k));const labels=['MIN','PTS','REB','AST','FG','3PT'];
        const rows=st.athletes.filter(a=>!a.didNotPlay).map(a=>`<tr><td class="team" style="font-family:var(--body)">${esc(a.athlete.shortName||a.athlete.displayName)}${a.starter?'':' <span class="note">·</span>'}</td>${idx.map(i=>`<td>${i>=0?esc(a.stats[i]??''):''}</td>`).join('')}</tr>`).join('');
        return `<div class="tblwrap" style="margin-bottom:12px"><table><thead><tr><th style="text-align:left">${esc(p.team.abbreviation)}</th>${labels.map(l=>`<th>${l}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table></div>`;}).join('');
    }else{
      const lead=(s.leaders||[]).map(t=>{const l=(t.leaders||[]).slice(0,3).map(c=>{const a=c.leaders&&c.leaders[0];if(!a)return '';return `<li><span class="pos">${esc(c.shortDisplayName||c.name)}</span><span>${esc(a.athlete&&a.athlete.shortName)}</span><span class="no" style="min-width:3em">${esc(a.displayValue)}</span></li>`;}).join('');
        return `<div><div class="form"><b>${esc(t.team.abbreviation)}</b></div><ol>${l}</ol></div>`;}).join('');
      const inj=(s.injuries||[]).map(t=>{const l=(t.injuries||[]).slice(0,6).map(i=>`<li><span class="pos">${esc(i.status||'')}</span><span>${esc(i.athlete&&i.athlete.shortName)}</span></li>`).join('');return l?`<div><div class="form"><b>${esc(t.team.abbreviation)}</b></div><ol>${l}</ol></div>`:'';}).join('');
      box.innerHTML=(lead?`<h4>Season leaders</h4><div class="lineups">${lead}</div>`:'')+(inj?`<h4>Injuries</h4><div class="lineups">${inj}</div>`:'')||`<p class="note">Box score appears at tip-off.</p>`;
    }
  }catch(err){const box=$('#box');if(box)box.innerHTML=`<p class="note">Details unavailable.</p>`;}
}

/* ---------- team detail ---------- */
async function openTeam(id){
  const t=S.teamsById[id];const name=t?(t.displayName||t.name):'Team';
  openModal(name,`<div class="loading">Loading…</div>`);
  const entry=S.standingsRows.find(e=>e.team.id==id);
  try{
    const [sch,ros]=await Promise.all([
      getJSON(`${API}/site/v2/sports/${SPORT}/${LG}/teams/${id}/schedule`).catch(()=>null),
      getJSON(`${API}/site/v2/sports/${SPORT}/${LG}/teams/${id}/roster`).catch(()=>null)]);
    let html='';
    if(entry){html+=`<div class="stats"><div><b>${stat(entry,['playoffSeed'])}</b><span>Seed</span></div><div><b>${stat(entry,['wins'])}-${stat(entry,['losses'])}</b><span>Record</span></div><div><b>${esc(String(stat(entry,['winPercent'])).replace(/^0\./,'.'))}</b><span>Pct</span></div><div><b>${stat(entry,['gamesBehind'])}</b><span>GB</span></div><div><b>${stat(entry,['Home'])}</b><span>Home</span></div><div><b>${stat(entry,['Road'])}</b><span>Road</span></div><div><b>${stat(entry,['Last Ten Games'])}</b><span>L10</span></div><div><b>${stat(entry,['streak'])}</b><span>Streak</span></div></div>`;}
    const evs=((sch&&sch.events)||[]).map(e=>{const c=e.competitions[0];const me=c.competitors.find(x=>x.team.id==id)||c.competitors[0];const op=c.competitors.find(x=>x.team.id!=id)||c.competitors[1];
      const st=(c.status||e.status||{}).type||{};const sc=x=>x.score&&(x.score.displayValue??x.score.value??x.score);return {id:e.id,date:new Date(e.date),home:me.homeAway==='home',op,me,done:st.completed,win:me.winner,ms:sc(me),os:sc(op)};}).sort((a,b)=>a.date-b.date);
    const now=Date.now();const past=evs.filter(e=>e.done).slice(-5);const next=evs.filter(e=>!e.done&&e.date>=now-4*36e5).slice(0,5);
    const row=e=>{let r='';let cls='';if(e.done){cls=e.win?'W':'L';r=`${cls} ${esc(e.ms)}–${esc(e.os)}`;}else r=fmtTime(e.date);
      return `<li><span class="d">${fmtDate(e.date,{month:'short',day:'numeric'})}</span><button data-ev="${e.id}">${e.home?'vs':'@'} ${esc(e.op.team.shortDisplayName||e.op.team.displayName)}</button><span class="r ${cls}">${r}</span></li>`;};
    html+=`<h4>Next 5</h4><ul class="sched">${next.length?next.map(row).join(''):'<li class="note">No upcoming games listed.</li>'}</ul>`;
    html+=`<h4>Last 5</h4><ul class="sched">${past.length?past.map(row).join(''):'<li class="note">No results yet.</li>'}</ul>`;
    const ath=(ros&&ros.athletes)||[];
    if(ath.length){const order={G:0,PG:0,SG:1,F:2,SF:2,PF:3,C:4};const ps=ath.slice().sort((a,b)=>(order[(a.position&&a.position.abbreviation)]??9)-(order[(b.position&&b.position.abbreviation)]??9)||(+a.jersey||99)-(+b.jersey||99));
      html+=`<h4>Roster</h4><ul class="roster">${ps.map(p=>`<li><span class="no">${esc(p.jersey||'')}</span><span class="pos">${esc((p.position&&p.position.abbreviation)||'')}</span><span>${esc(p.displayName)}</span></li>`).join('')}</ul>`;}
    $('#m-body').innerHTML=html;
    $('#m-body').querySelectorAll('[data-ev]').forEach(b=>b.onclick=()=>{const e=S.events.find(x=>x.id===b.dataset.ev);if(e)openGame(e.id);else jumpToGame(b.dataset.ev,evs.find(x=>x.id===b.dataset.ev));});
  }catch(err){$('#m-body').innerHTML=`<div class="err">Team page failed. ${esc(err.message)}</div>`;}
}
function jumpToGame(id,e){if(!e)return;closeModal();S.weekStart=mondayOf(e.date);loadFixtures().then(()=>{if(S.events.find(x=>x.id===id))openGame(id);});}

/* ---------- boot ---------- */
function loadAll(){loadStandings();loadFixtures();}
S.weekStart=mondayOf(new Date());
renderLeagueTabs();syncViewTabs();loadAll();
setInterval(()=>{if(S.events.some(e=>e.state==='in'))loadFixtures();},60000);
</script>
